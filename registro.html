    <main>
        <section>
            <h1>Conquer Academy | Registro</h1>
            <img src="media/imagenes/imagen_registro.jpg" alt="Registro Conquer Blocks" width="600" height="150">
        </section>


        <section>
        <form action="" name="regsitro" method="get">
            <h2>Formulario de Registro</h2>
            <fieldset>
                <legend>Datos Personales</legend>
            <p>
                <label for="full_name">Nombre Completo</label><br/>
                <input type="text" name="Nombre" required minlength="15" maxlength="100" id="full_name" autocomplete="on" size="100"><br>
            </p>
            <p>
                <label for="date_birth">Fecha de Nacimiento</label><br/>
                <input type="date" name="fecha_nac" id="date_birth" required><br>
            </p>
            <p>
                <label for="email">Email</label><br/>
                <input type="email" name="email" id="email" required size="50"><br>
            </p>
            <p>
                <label for="direccion">Dirección</label><br/>
                <input type="text" name="direccion" id="direccion" required size="50"><br>
            </p>
            <p>
                <label for="web">Página Web</label><br/>
                <input type="url" name="web" id="web" size="75"><br>
            </p>
            <p>
                <label for="foto">Foto</label>
                <input type="file" id="foto" required>
            </p>
            <p>
                <label for="bio">Biografía</label><br/>
                <textarea name="biografia" id="bio" cols="50" rows="7" placeholder="Escribe aquí tu biografía"></textarea><br>
            </p>
            </fieldset>
        </form>
        </section>
    </main>
