                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z" /></svg>

                        Contacto

                    <div class="flex items-center gap-2 ml-4 pl-4 border-l border-slate-700">
                        <a href="registro.html" class="px-4 py-2 bg-orange-500 text-white rounded-lg text-sm font-semibold">Registro</a>
                        <a href="login.html" class="px-4 py-2 border border-orange-500 text-orange-400 hover:bg-orange-500 hover:text-white rounded-lg transition-all duration-200 text-sm font-semibold">Login</a>
                    </div>
                </nav>
                <button id="menu-btn" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors">
                    <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                    <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 hidden"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-slate-800 border-t border-slate-700">
            <nav class="flex flex-col px-4 py-3 gap-1">
                <a href="index.html" class="px-3 py-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>Home</a>
                <a href="about_us.html" class="px-3 py-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" /></svg>Quiénes Somos</a>
                <a href="cursos/cursos_list.html" class="px-3 py-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 3.741-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" /></svg>Cursos</a>
                <a href="blog/blog_list.html" class="px-3 py-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z" /></svg>Blog</a>
                <a href="contacto.html" class="px-3 py-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>Contacto</a>
                <div class="pt-2 mt-1 border-t border-slate-700 flex flex-col gap-2">
                    <a href="registro.html" class="px-4 py-2.5 bg-orange-500 text-white rounded-lg text-sm font-semibold text-center">Registro</a>
                    <a href="login.html" class="px-4 py-2.5 border border-orange-500 text-orange-400 hover:bg-orange-500 hover:text-white rounded-lg text-sm font-semibold text-center transition-all">Login</a>

            </nav>

    </header>

    <main class="flex-1 py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto">
            <!-- Top image -->
            <div class="overflow-hidden rounded-2xl mb-8 h-40">
                <img src="media/imagenes/imagen_registro.jpg" alt="Registro Conquer Academy" class="w-full h-full object-cover">
            </div>

            <!-- Form card -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-black/50">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-orange-500/10 rounded-xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-orange-400">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM4 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 10.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">Crear Cuenta</h1>
                        <p class="text-slate-400 text-xs">Únete a Conquer Academy hoy</p>
                    </div>
                </div>

                <form action="" name="registro" method="get">
                    <fieldset class="border border-slate-600 rounded-xl p-5 sm:p-6">
                        <legend class="px-3 text-orange-400 text-sm font-semibold flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                            </svg>
                            Datos Personales
                        </legend>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-4">
                            <!-- Full name -->
                            <div class="sm:col-span-2">
                                <label for="full_name" class="block text-sm font-medium text-slate-300 mb-1.5">Nombre Completo <span class="text-orange-400">*</span></label>
                                <input type="text" name="Nombre" id="full_name" required minlength="15" maxlength="100" autocomplete="on"
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors"
                                    placeholder="Tu nombre completo">
                            </div>

                            <!-- Date of birth -->
                            <div>
                                <label for="date_birth" class="block text-sm font-medium text-slate-300 mb-1.5">Fecha de Nacimiento <span class="text-orange-400">*</span></label>
                                <input type="date" name="fecha_nac" id="date_birth" required
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
                            </div>

                            <!-- Email -->
                            <div>
                                <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email <span class="text-orange-400">*</span></label>
                                <input type="email" name="email" id="email" required
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors"
                                    placeholder="tu@email.com">
                            </div>

                            <!-- Address -->
                            <div class="sm:col-span-2">
                                <label for="direccion" class="block text-sm font-medium text-slate-300 mb-1.5">Dirección <span class="text-orange-400">*</span></label>
                                <input type="text" name="direccion" id="direccion" required
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors"
                                    placeholder="Tu dirección">
                            </div>

                            <!-- Website -->
                            <div class="sm:col-span-2">
                                <label for="web" class="block text-sm font-medium text-slate-300 mb-1.5">Página Web</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-slate-500">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5a17.92 17.92 0 0 1-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                                        </svg>
                                    </div>
                                    <input type="url" name="web" id="web"
                                        class="w-full bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors"
                                        placeholder="https://tu-web.com">
                                </div>
                            </div>

                            <!-- Photo -->
                            <div class="sm:col-span-2">
                                <label for="foto" class="block text-sm font-medium text-slate-300 mb-1.5">Foto de Perfil <span class="text-orange-400">*</span></label>
                                <input type="file" id="foto" required accept="image/*"
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-400 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition-colors file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-orange-500/10 file:text-orange-400 file:text-xs file:font-medium hover:file:bg-orange-500/20 cursor-pointer">
                            </div>

                            <!-- Bio -->
                            <div class="sm:col-span-2">
                                <label for="bio" class="block text-sm font-medium text-slate-300 mb-1.5">Biografía</label>
                                <textarea name="biografia" id="bio" rows="4" placeholder="Cuéntanos sobre ti, tu experiencia y motivación..."
                                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors resize-none"></textarea>
                            </div>
                        </div>
                    </fieldset>

                    <div class="mt-6">
                        <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 hover:-translate-y-0.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM4 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 10.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
                            </svg>
                            Crear Cuenta
                        </button>
                    </div>

                    <p class="text-center text-slate-400 text-sm mt-5">
                        ¿Ya tienes cuenta?
                        <a href="login.html" class="text-orange-400 hover:text-orange-300 font-medium transition-colors">Inicia sesión</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 mt-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <a href="index.html"><img src="media/imagenes/logo_conquerblocks.png" alt="Logo ConquerBlocks" class="h-8 w-auto"></a>
                <p class="text-slate-400 text-sm text-center">&copy; 2026 Conquer Blocks. Todos los derechos reservados.</p>
                <div class="flex items-center gap-4">
                    <a href="politicas.html" class="text-slate-400 hover:text-orange-400 text-sm transition-colors">Políticas de Privacidad</a>
                    <a href="contacto.html" class="text-slate-400 hover:text-orange-400 text-sm transition-colors">Contacto</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('icon-open');
        const iconClose = document.getElementById('icon-close');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            iconOpen.classList.toggle('hidden');
            iconClose.classList.toggle('hidden');
        });
    </script>
</body>
</html>
