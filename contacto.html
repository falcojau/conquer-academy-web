    <main>
        <section>
            <h1>Conquer Academy | Contacto</h1>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d16119.716004616617!2d2.151702201429171!3d41.389057192503586!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4a2ed494b4161%3A0x40d2782f9e2e4e0f!2sCasa%20Batll%C3%B3!5e0!3m2!1ses!2ses!4v1767694657991!5m2!1ses!2ses" width="700" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>


        <section>
        <form action="" name="regsitro" method="get">
            <h2>Formulario de Contacto</h2>
            <p>
                <label for="full_name">Nombre Completo</label><br/>
                <input type="text" name="Nombre" minlength="15" maxlength="100" id="full_name" autocomplete="on" size="100"><br>
            </p>
            <p>
                <label for="email">Email</label><br/>
                <input type="email" name="email" id="email" required size="50"><br>
            </p>
            <p>
                <label for="mensaje">Mensaje</label><br/>
                <textarea name="mensaje" id="mensaje" cols="50" rows="7" placeholder="Tu mensaje" required></textarea><br>
            </p>
        <p>
            <input type="checkbox" name="politicas" id="politicas" required>
            <label for="politicas">He leído y acepto las <a href="politicas.html">políticas de privacidad</a></label> 
        <p>
        <button>Enviar</button>
        </form>
        </section>
    </main>
